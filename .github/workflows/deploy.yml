name: Deploy

# Deploys to Vercel with the Super Admin's token, so contributors don't need a Vercel seat.
# Vercel's own Git deployments are off (vercel.json → git.deploymentEnabled).
#   - pull request → preview deployment, link posted on the PR (required check "preview")
#   - push to main  → production, on both automiqautomation.com and automiqautomation.ca (also started by the Claude review's merge step, because merges
#     made with a workflow's own token don't trigger push workflows)
#
# Security: this runs from main's copy of the file (pull_request_target), so a pull request can't
# change it or reach the token, which lives in the "vercel-deploy" environment (main only). The
# PR's code is only uploaded: Vercel builds it on its own servers with the Preview environment
# variables (public values only). Nothing from the PR is installed or run here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_lnakwJdFCmBXX5sG7ONQrGF3
  VERCEL_PROJECT_ID: prj_G7cjtmObKmfYn07yLQ5xnIGT55Ao
  VERCEL_CLI: vercel@65.9.0

jobs:
  preview:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: vercel-deploy
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 30
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --global "$VERCEL_CLI"

      - id: deploy
        name: Deploy preview (build logs below)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rm -rf pr-head/.git
          url=$(vercel deploy pr-head --yes --logs --token "$VERCEL_TOKEN" --meta "pr=$PR" --meta "commit=$SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Post the link on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$URL" ]; then
            body="**Preview** for ${SHA:0:7}: $URL

          No login needed. Forms sent from a preview are saved as **Test** leads."
          else
            body="**Preview failed** for ${SHA:0:7}. The build log is in the [preview check]($RUN)."
          fi
          body="<!-- automiq-preview -->
          $body"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- automiq-preview -->")))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    environment:
      name: vercel-deploy
      url: https://automiqautomation.com
    timeout-minutes: 30
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --global "$VERCEL_CLI"

      - name: Deploy production (build logs below)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          rm -rf .git
          vercel deploy --prod --yes --logs --token "$VERCEL_TOKEN" --meta "commit=$GITHUB_SHA"

  # automiqautomation.ca: same code, its own Vercel project (NEXT_PUBLIC_SITE_COUNTRY=CA, see src/lib/site.ts)
  production-ca:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    environment:
      name: vercel-deploy
      url: https://automiqautomation.ca
    timeout-minutes: 30
    concurrency:
      group: production-ca
      cancel-in-progress: false
    env:
      VERCEL_PROJECT_ID: prj_57T6qYCkRnjGFmbMEu1PWRYCsvsm # automiq-ca
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --global "$VERCEL_CLI"

      - name: Deploy production .ca (build logs below)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          rm -rf .git
          vercel deploy --prod --yes --logs --token "$VERCEL_TOKEN" --meta "commit=$GITHUB_SHA"
